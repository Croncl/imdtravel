# IMDTravel — Parte 2 (FAULT-TOLERANT). IMDTravel construído de ./imd-travel; os outros três vêm do Docker Hub.
#

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 40s

services:
  airlineshub:
    image: gibeonufrn/imdtravel-airlineshub:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      CATALOG_FLIGHTS: ${CATALOG_FLIGHTS:-IMD100,IMD200,IMD300}
      CATALOG_BASE_PRICES: ${CATALOG_BASE_PRICES:-350.50,420.50,510.50}
      CATALOG_PRICE_STEP_PER_DAY: ${CATALOG_PRICE_STEP_PER_DAY:-12.25}
      CATALOG_START_DATE: ${CATALOG_START_DATE:-2026-12-01}
      CATALOG_DAYS: ${CATALOG_DAYS:-7}
      CATALOG_SEATS: ${CATALOG_SEATS:-20}
      SELL_MIN_MS: ${SELL_MIN_MS:-300}
      SELL_MAX_MS: ${SELL_MAX_MS:-900}
      FAULT_FLIGHT_P: ${FAULT_FLIGHT_P:-0}
      FAULT_FLIGHT_TTL_SEC: ${FAULT_FLIGHT_TTL_SEC:-10}
      FAULT_SELL_P: ${FAULT_SELL_P:-0}
      FAULT_SELL_TTL_SEC: ${FAULT_SELL_TTL_SEC:-10}
    healthcheck: *healthcheck

  exchange:
    image: gibeonufrn/imdtravel-exchange:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      EXCHANGE_INITIAL_RATE: ${EXCHANGE_INITIAL_RATE:-5.50}
      EXCHANGE_TICK_S: ${EXCHANGE_TICK_S:-10}
      EXCHANGE_MAX_STEP_PCT: ${EXCHANGE_MAX_STEP_PCT:-0.3}
      EXCHANGE_MIN: ${EXCHANGE_MIN:-5.00}
      EXCHANGE_MAX: ${EXCHANGE_MAX:-6.00}
      FAULT_CONVERT_P: ${FAULT_CONVERT_P:-0}
      FAULT_CONVERT_TTL_SEC: ${FAULT_CONVERT_TTL_SEC:-10}
    healthcheck: *healthcheck

  fidelity:
    image: gibeonufrn/imdtravel-fidelity:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      FAULT_BONUS_P: ${FAULT_BONUS_P:-0}
      FAULT_BONUS_TTL_SEC: ${FAULT_BONUS_TTL_SEC:-10}
    healthcheck: *healthcheck

  imdtravel:
    build: ./imd-travel
    environment:
      PORT: 8080
      SALES_DIR: /data
      AIRLINESHUB_URL: http://airlineshub:8080
      EXCHANGE_URL: http://exchange:8080
      FIDELITY_URL: http://fidelity:8080
      # Timeout (P1): prazo total da compra e limite de cada chamada
      BUY_DEADLINE_MS: ${BUY_DEADLINE_MS:-4500}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3500}
      FLIGHT_TIMEOUT_MS: ${FLIGHT_TIMEOUT_MS:-1000}
      CONVERT_TIMEOUT_MS: ${CONVERT_TIMEOUT_MS:-1000}
      SELL_TIMEOUT_MS: ${SELL_TIMEOUT_MS:-2000}
      BONUS_TIMEOUT_MS: ${BONUS_TIMEOUT_MS:-1000}
      # Circuit Breaker (P7): um por endpoint (flight, convert, sell, bonus)
      CB_VOLUME_THRESHOLD: ${CB_VOLUME_THRESHOLD:-5}
      CB_ROLLING_WINDOW_MS: ${CB_ROLLING_WINDOW_MS:-20000}
      CB_ERROR_THRESHOLD_PCT: ${CB_ERROR_THRESHOLD_PCT:-50}
      CB_RESET_TIMEOUT_MS: ${CB_RESET_TIMEOUT_MS:-10000}
    ports:
      - "${IMDTRAVEL_HOST_PORT:-8080}:8080"   # a única porta exposta ao hospedeiro
    volumes:
      - sales-data:/data
    healthcheck: *healthcheck
    depends_on:
      airlineshub: { condition: service_healthy }
      exchange:    { condition: service_healthy }
      fidelity:    { condition: service_healthy }

volumes:
  sales-data:
